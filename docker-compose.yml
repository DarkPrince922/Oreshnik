services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oreshnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oreshnik}
      POSTGRES_DB: ${POSTGRES_DB:-oreshnik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oreshnik}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./backend:/app
      - strix_runs:/data/strix_runs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    # One worker process per concurrent scan (each scan = one Strix run + sandbox containers + LLM spend).
    command: celery -A app.worker.celery_app.celery worker --loglevel=info --concurrency=${SCAN_CONCURRENCY:-2} --prefetch-multiplier=1
    # `docker compose stop` makes Celery wait for running scans. After this period Docker kills the worker;
    # the reaper then fails those scans (no heartbeat) and removes their sandbox containers.
    stop_grace_period: 60s
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./backend:/app
      - strix_runs:/data/strix_runs
      # docker.sock mounted so the worker can run Strix sandbox containers.
      # Host-root level access — accepted for single-VM deployment.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
      - redis

  beat:
    build: ./backend
    command: celery -A app.worker.celery_app.celery beat --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  strix_runs:
