# Serves the built panel and hands /api (REST and WebSockets) on to the backend container.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads to the agent and long answers of the API.
    client_max_body_size 400m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets: the live log of a scan and the agent's feed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Files with a hash in the name never change: let the browser keep them.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Every other address is a page of the panel: the app itself decides what to show.
    location / {
        try_files $uri /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
